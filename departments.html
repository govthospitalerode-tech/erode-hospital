<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Departments — Thanthai Periyar Govt Hospital Erode</title>
  <link rel="icon" type="image/x-icon" href="/public/favicon.ico"/>
  <link rel="apple-touch-icon" href="/public/favicon-192.png"/>
  <link rel="shortcut icon" href="/public/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .dept-body { max-width:1100px; margin:0 auto; padding:64px 48px; }
    .dept-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }

    /* ── FLIP CARD ── */
    .flip-wrap {
      perspective: 1000px;
      height: 260px;
      cursor: pointer;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
      transform-style: preserve-3d;
    }
    .flip-wrap:hover .flip-inner,
    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-md, 12px);
      overflow: hidden;
    }

    /* FRONT */
    .flip-front {
      background: var(--white, #fff);
      border: 1px solid var(--border, #e5e7eb);
      padding: 28px;
      display: flex;
      flex-direction: column;
    }
    .flip-front::before {
      content:'';
      position:absolute; top:0; left:0;
      width:100%; height:4px;
      background:linear-gradient(90deg,var(--primary,#0d2b45),var(--secondary,#e67e22));
    }
    .dept-icon { font-size:36px; margin-bottom:14px; }
    .dept-name { font-size:18px; margin-bottom:6px; font-family:'Playfair Display',serif; color:var(--primary,#0d2b45); }
    .dept-head { font-size:12px; color:var(--muted,#6b7280); margin-bottom:4px; }
    .dept-head strong { color:var(--primary,#0d2b45); font-size:13px; }
    .dept-desc { font-size:13px; color:var(--muted,#6b7280); line-height:1.6; margin-top:10px; flex:1; }
    .dept-meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .dept-badge { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--primary,#0d2b45); background:var(--cream,#f8f5f0); padding:4px 9px; border-radius:4px; }
    .flip-hint { font-size:11px; color:var(--secondary,#e67e22); font-weight:600; margin-top:10px; letter-spacing:0.5px; }

    /* BACK */
    .flip-back {
      background: linear-gradient(135deg, var(--primary,#0d2b45) 0%, #1a5276 100%);
      transform: rotateY(180deg);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .flip-back-title {
      font-size:13px; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--secondary,#e67e22); font-family:'DM Sans',sans-serif;
      margin-bottom:12px; font-weight:700;
    }
    .flip-doctors {
      flex:1; overflow-y:auto;
      display:flex; flex-direction:column; gap:6px;
    }
    .flip-doctors::-webkit-scrollbar { width:3px; }
    .flip-doctors::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:2px; }
    .flip-doctor-item {
      font-size:12.5px; color:rgba(255,255,255,0.88);
      padding:5px 8px;
      background:rgba(255,255,255,0.07);
      border-radius:5px;
      border-left:2px solid var(--secondary,#e67e22);
    }
    .flip-back-action {
      margin-top:12px;
      background:var(--secondary,#e67e22);
      color:#fff;
      border:none; border-radius:6px;
      padding:7px 14px;
      font-size:12px; font-weight:700;
      cursor:pointer;
      width:100%;
      transition:opacity 0.2s;
    }
    .flip-back-action:hover { opacity:0.85; }

    /* ── POPUP MODAL ── */
    .dept-modal-overlay {
      display:none;
      position:fixed; inset:0; z-index:1000;
      background:rgba(5,30,52,0.72);
      backdrop-filter:blur(4px);
      align-items:center; justify-content:center;
      padding:20px;
    }
    .dept-modal-overlay.open { display:flex; }
    .dept-modal {
      background:#fff;
      border-radius:16px;
      max-width:560px; width:100%;
      max-height:90vh;
      overflow:hidden;
      display:flex; flex-direction:column;
      box-shadow:0 24px 64px rgba(0,0,0,0.25);
      animation: modalIn 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes modalIn {
      from { opacity:0; transform:translateY(20px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .dept-modal-header {
      background:linear-gradient(135deg,var(--primary,#0d2b45) 0%,#1a5276 100%);
      padding:28px 32px 22px;
      flex-shrink:0;
      position:relative;
    }
    .dept-modal-header .m-icon { font-size:40px; margin-bottom:8px; display:block; }
    .dept-modal-header h2 { color:#fff; font-size:22px; margin:0 0 4px; font-family:'Playfair Display',serif; }
    .dept-modal-header p { color:rgba(255,255,255,0.7); font-size:13px; margin:0; }
    .dept-modal-close {
      position:absolute; top:16px; right:16px;
      background:rgba(255,255,255,0.15); border:none;
      color:#fff; width:34px; height:34px; border-radius:50%;
      font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background 0.2s;
    }
    .dept-modal-close:hover { background:rgba(255,255,255,0.28); }
    .dept-modal-body { padding:28px 32px; overflow-y:auto; flex:1; }
    .m-section-label { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--secondary,#e67e22); font-weight:700; margin-bottom:12px; }
    .m-desc { font-size:14px; color:#4b5563; line-height:1.75; margin-bottom:24px; }
    .m-meta-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
    .m-badge { display:inline-flex; align-items:center; gap:6px; background:#f0f4f8; border-radius:6px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--primary,#0d2b45); }
    .m-doctors-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .m-doctor-card {
      background:#f8f9fa; border:1px solid #e5e7eb; border-radius:8px;
      padding:10px 12px;
      font-size:13px; color:#374151; font-weight:500;
      border-left:3px solid var(--secondary,#e67e22);
    }

    @media(max-width:900px) { .dept-grid { grid-template-columns:repeat(2,1fr); } .dept-body { padding:40px 20px; } .flip-wrap { height:280px; } }
    @media(max-width:560px) { .dept-grid { grid-template-columns:1fr; } .m-doctors-grid { grid-template-columns:1fr; } .dept-modal-body { padding:20px; } .dept-modal-header { padding:22px 20px 16px; } }
  </style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-breadcrumb"><a href="/index.html" id="breadHome">Home</a> › <span id="breadCurrent">Departments</span></div>
    <h1 id="pageTitle">Our Departments</h1>
    <p id="pageDesc">Specialised departments providing free diagnosis, treatment, and surgery to all patients. Hover a card to see the medical team.</p>
  </div>
</div>

<div class="dept-body">
  <div class="dept-grid" id="deptGrid">
    <div class="loading-box"><div class="spinner"></div>Loading departments...</div>
  </div>
</div>

<!-- MODAL -->
<div class="dept-modal-overlay" id="deptModal" role="dialog" aria-modal="true">
  <div class="dept-modal">
    <div class="dept-modal-header">
      <button class="dept-modal-close" id="modalClose" aria-label="Close">✕</button>
      <span class="m-icon" id="mIcon"></span>
      <h2 id="mName"></h2>
      <p id="mOpdBeds"></p>
    </div>
    <div class="dept-modal-body">
      <div class="m-section-label" id="mAboutLabel">About</div>
      <p class="m-desc" id="mDesc"></p>
      <div class="m-meta-row" id="mMeta"></div>
      <div class="m-section-label" id="mDoctorsLabel">Medical Team</div>
      <div class="m-doctors-grid" id="mDoctors"></div>
    </div>
  </div>
</div>

<footer class="footer" id="footer"></footer>
<script src="/shared.js"></script>
<script>
let CURRENT_DEPTS = [];
let CURRENT_LABELS = {};
let CURRENT_IS_TA = false;
let OPEN_DEPT_ID = null;

function tt(en, ta) { return CURRENT_IS_TA ? ta : en; }

function openModal(dept) {
  const doctors = dept.doctors || [];
  const L = CURRENT_LABELS;
  OPEN_DEPT_ID = dept.id;
  document.getElementById('mIcon').textContent  = dept.icon;
  document.getElementById('mName').textContent  = tt(dept.name_en, dept.name_ta);
  document.getElementById('mOpdBeds').textContent =
    (dept.beds > 0 ? `${dept.beds} ${tt(L.beds_en, L.beds_ta)} · ` : '') + `OPD: ${tt(dept.opd_days_en, dept.opd_days_ta)}`;
  document.getElementById('mAboutLabel').textContent = tt(L.about_en, L.about_ta);
  document.getElementById('mDesc').textContent  = tt(dept.desc_en, dept.desc_ta);
  document.getElementById('mMeta').innerHTML =
    (dept.beds > 0 ? `<span class="m-badge">🛏️ ${dept.beds} ${tt(L.beds_en, L.beds_ta)}</span>` : '') +
    `<span class="m-badge">🕐 ${tt(dept.opd_days_en, dept.opd_days_ta)}</span>` +
    (doctors.length ? `<span class="m-badge">👨‍⚕️ ${doctors.length} ${tt(L.doctors_en, L.doctors_ta)}</span>` : '');
  document.getElementById('mDoctorsLabel').textContent = tt(L.medical_team_en, L.medical_team_ta);
  document.getElementById('mDoctorsLabel').style.display = doctors.length ? 'block' : 'none';
  document.getElementById('mDoctors').innerHTML = doctors.length
    ? doctors.map(n => `<div class="m-doctor-card">👨‍⚕️ ${n}</div>`).join('')
    : '';
  document.getElementById('deptModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  OPEN_DEPT_ID = null;
  document.getElementById('deptModal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('deptModal').addEventListener('click', e => {
  if (e.target === document.getElementById('deptModal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function buildGrid() {
  const L = CURRENT_LABELS;
  document.getElementById('deptGrid').innerHTML = CURRENT_DEPTS.map((d, i) => {
    const doctors = d.doctors || [];
    const previewDoctors = doctors.slice(0, 4);
    const name = tt(d.name_en, d.name_ta);
    const desc = tt(d.desc_en, d.desc_ta);
    const opd  = tt(d.opd_days_en, d.opd_days_ta);
    return `
      <div class="flip-wrap fade-up" style="animation-delay:${i*0.04}s" data-id="${d.id}" tabindex="0" role="button" aria-label="${name}">
        <div class="flip-inner">
          <div class="flip-front">
            <div class="dept-icon">${d.icon}</div>
            <h2 class="dept-name">${name}</h2>
            <p class="dept-desc">${desc.substring(0,100)}…</p>
            <div class="dept-meta">
              ${d.beds > 0 ? `<span class="dept-badge">🛏️ ${d.beds} ${tt(L.beds_en, L.beds_ta)}</span>` : ''}
              <span class="dept-badge">🕐 ${opd}</span>
            </div>
            <div class="flip-hint">↩ ${tt(L.hover_hint_en, L.hover_hint_ta)}</div>
          </div>
          <div class="flip-back">
            <div class="flip-back-title">👨‍⚕️ ${tt(L.medical_team_en, L.medical_team_ta)} (${doctors.length})</div>
            <div class="flip-doctors">
              ${previewDoctors.map(dr => `<div class="flip-doctor-item">${dr}</div>`).join('')}
              ${doctors.length > 4 ? `<div class="flip-doctor-item" style="opacity:0.6;">+${doctors.length-4} more…</div>` : ''}
              ${doctors.length === 0 ? `<div class="flip-doctor-item" style="opacity:0.6;">${tt(L.rotating_team_en, L.rotating_team_ta)}</div>` : ''}
            </div>
            <button class="flip-back-action" data-id="${d.id}">${tt(L.view_details_en, L.view_details_ta)}</button>
          </div>
        </div>
      </div>`;
  }).join('');

  document.querySelectorAll('.flip-back-action').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const dept = CURRENT_DEPTS.find(d => d.id === btn.dataset.id);
      if (dept) openModal(dept);
    });
  });

  document.querySelectorAll('.flip-wrap').forEach(wrap => {
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const dept = CURRENT_DEPTS.find(d => d.id === wrap.dataset.id);
        if (dept) openModal(dept);
      }
    });
  });
}

function renderDepartments(data) {
  const lang = localStorage.getItem('gh_lang') || 'en';
  CURRENT_IS_TA = lang === 'ta';
  const dp = data.departments_page;
  if (!dp) return;

  document.getElementById('breadHome').textContent    = tt('Home', 'முகப்பு');
  document.getElementById('breadCurrent').textContent = tt(dp.page_hero.breadcrumb_en, dp.page_hero.breadcrumb_ta);
  document.getElementById('pageTitle').textContent    = tt(dp.page_hero.title_en, dp.page_hero.title_ta);
  document.getElementById('pageDesc').textContent     = tt(dp.page_hero.desc_en, dp.page_hero.desc_ta);

  CURRENT_LABELS = dp.ui_labels;
  CURRENT_DEPTS  = dp.departments_full || [];

  buildGrid();

  // Keep modal in sync if it was open during a language switch
  if (OPEN_DEPT_ID) {
    const dept = CURRENT_DEPTS.find(d => d.id === OPEN_DEPT_ID);
    if (dept) openModal(dept); else closeModal();
  }
}

async function loadDepartments() {
  try {
    const res  = await fetch('/hospital');
    const data = await res.json();
    renderDepartments(data);
    document.addEventListener('langchange', () => renderDepartments(data));
  } catch (e) { console.error(e); }
}
document.addEventListener('DOMContentLoaded', loadDepartments);
</script>
</body>
</html>
