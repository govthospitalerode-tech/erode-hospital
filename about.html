<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/public/favicon.ico"/>
  <link rel="apple-touch-icon" href="/public/favicon-192.png"/>
  <link rel="shortcut icon" href="/public/favicon.ico"/>
  <title>About — Thanthai Periyar Govt Hospital Erode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .about-body { max-width:1100px; margin:0 auto; padding:64px 48px; display:grid; grid-template-columns:1fr 360px; gap:56px; align-items:start; }
    .about-content h2 { font-size:clamp(22px,3vw,32px); margin-bottom:16px; }
    .about-content p { font-size:15px; color:var(--body-text); line-height:1.8; margin-bottom:20px; }
    .about-content p strong { color:var(--primary); }
    .timeline { margin-top:40px; }
    .timeline h3 { font-size:20px; margin-bottom:24px; }
    .tl-item { display:flex; gap:20px; margin-bottom:24px; }
    .tl-year { background:var(--primary); color:var(--white); font-family:'Manrope','Noto Sans Tamil',sans-serif; font-size:15px; font-weight:700; padding:6px 12px; border-radius:6px; white-space:nowrap; height:fit-content; min-width:56px; text-align:center; }
    .tl-body { font-size:14px; color:var(--body-text); line-height:1.65; border-left:2px solid var(--border); padding-left:20px; padding-bottom:12px; }
    .tl-body strong { display:block; color:var(--primary); font-size:15px; margin-bottom:4px; }
    .quality-recognition { margin-top:28px; padding:20px 22px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--white); }
    .quality-recognition h3 { font-size:17px; margin-bottom:8px; }
    .quality-recognition p { margin:0; }

    .about-sidebar { display:flex; flex-direction:column; gap:20px; }
    .info-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px; }
    .info-card h4 { font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--secondary); margin-bottom:16px; font-family:'Manrope',sans-serif; }
    .info-row { display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; font-size:13.5px; }
    .info-row span:first-child { font-size:16px; flex-shrink:0; width:20px; }
    .info-row strong { color:var(--primary); display:block; font-size:12px; }

    @media(max-width:900px) {
      .about-body { grid-template-columns:1fr; padding:40px 20px; }
    }
  </style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-breadcrumb"><a href="/index.html" id="breadHome">Home</a> › <span id="breadCurrent">About</span></div>
    <h1 id="pageTitle">About the Hospital</h1>
    <p id="pageDesc">The history and services of Thanthai Periyar Government Headquarters Hospital, Erode.</p>
  </div>
</div>

<div class="about-body">
  <div class="about-content">
    <h2 id="aboutHeading">Thanthai Periyar Government Headquarters Hospital</h2>
    <div id="aboutParagraphs"></div>

    <div class="timeline">
      <h3 id="timelineTitle">Key Milestones</h3>
      <div id="timelineList"></div>
      <div class="quality-recognition">
        <h3 id="qualityTitle">Accreditations &amp; Recognition</h3>
        <p id="qualityDesc"></p>
      </div>
    </div>
  </div>

  <div class="about-sidebar">
    <div class="info-card">
      <h4 id="quickInfoLabel">Quick Info</h4>
      <div id="quickInfoRows"></div>
    </div>
    <div class="info-card">
      <h4 id="glanceLabel">At a Glance</h4>
      <div id="glanceRows"></div>
    </div>
  </div>
</div>

<footer class="footer" id="footer"></footer>
<script src="/shared.js"></script>
<script>
function renderAbout(data) {
  const lang = localStorage.getItem('gh_lang') || 'en';
  const isTa = lang === 'ta';
  const a = data.about;
  if (!a) return;
  const t = (en, ta) => isTa ? ta : en;

  document.getElementById('breadHome').textContent    = t('Home', 'முகப்பு');
  document.getElementById('breadCurrent').textContent = t(a.page_hero.breadcrumb_en, a.page_hero.breadcrumb_ta);
  document.getElementById('pageTitle').textContent    = t(a.page_hero.title_en, a.page_hero.title_ta);
  document.getElementById('pageDesc').textContent     = t(a.page_hero.desc_en, a.page_hero.desc_ta);
  document.getElementById('aboutHeading').textContent = t(a.heading_en, a.heading_ta);

  document.getElementById('aboutParagraphs').innerHTML = (a.paragraphs || [])
    .map(p => `<p>${isTa ? p.ta : p.en}</p>`).join('');

  document.getElementById('timelineTitle').textContent = t(a.timeline_title_en, a.timeline_title_ta);
  document.getElementById('timelineList').innerHTML = (a.timeline || []).map(item => `
    <div class="tl-item">
      <div class="tl-year">${item.year}</div>
      <div class="tl-body"><strong>${t(item.title_en, item.title_ta)}</strong>${t(item.desc_en, item.desc_ta)}</div>
    </div>`).join('');

  const s = a.sidebar_labels;
  document.getElementById('quickInfoLabel').textContent = t(s.quick_info_en, s.quick_info_ta);
  document.getElementById('glanceLabel').textContent    = t(s.glance_en, s.glance_ta);

  const h = data.hospital;
  document.getElementById('quickInfoRows').innerHTML = `
    <div class="info-row"><span>📍</span><div><strong>${t(s.address_en, s.address_ta)}</strong>${isTa ? h.address_ta : h.address_en}</div></div>
    <div class="info-row"><span>📞</span><div><strong>${t(s.phone_en, s.phone_ta)}</strong>${h.phone.join(' / ')}</div></div>
    <div class="info-row"><span>🚑</span><div><strong>${t(s.emergency_en, s.emergency_ta)}</strong>${t(s.emergency_val_en, s.emergency_val_ta)}</div></div>
    <div class="info-row"><span>🩸</span><div><strong>${t(s.blood_bank_en, s.blood_bank_ta)}</strong>${t(s.blood_bank_val_en, s.blood_bank_val_ta)}</div></div>
    <div class="info-row"><span>🕐</span><div><strong>${t(s.opd_hours_en, s.opd_hours_ta)}</strong>${t(s.opd_hours_val_en, s.opd_hours_val_ta)}</div></div>
    <div class="info-row"><span>🌐</span><div><strong>${t(s.authority_label_en, s.authority_label_ta)}</strong>${isTa ? h.authority_ta : h.authority_en}</div></div>
  `;

  document.getElementById('glanceRows').innerHTML = `
    <div class="info-row"><span>🛏️</span><div><strong>${t(s.total_beds_en, s.total_beds_ta)}</strong>${t(s.total_beds_val_en, s.total_beds_val_ta)}</div></div>
    <div class="info-row"><span>👨‍⚕️</span><div><strong>${t(s.medical_officers_en, s.medical_officers_ta)}</strong>${t(s.medical_officers_val_en, s.medical_officers_val_ta)}</div></div>
    <div class="info-row"><span>🏛️</span><div><strong>${t(s.departments_en, s.departments_ta)}</strong>${t(s.departments_val_en, s.departments_val_ta)}</div></div>
    <div class="info-row"><span>🏗️</span><div><strong>${t(s.ss_block_en, s.ss_block_ta)}</strong>${t(s.ss_block_val_en, s.ss_block_val_ta)}</div></div>
    <div class="info-row"><span>📅</span><div><strong>${t(s.founded_en, s.founded_ta)}</strong>${t(s.founded_val_en, s.founded_val_ta)}</div></div>
    <div class="info-row"><span>🫘</span><div><strong>${t(s.haemodialysis_en, s.haemodialysis_ta)}</strong>${t(s.haemodialysis_val_en, s.haemodialysis_val_ta)}</div></div>
    <div class="info-row"><span>📐</span><div><strong>${t(s.campus_en, s.campus_ta)}</strong>${t(s.campus_val_en, s.campus_val_ta)}</div></div>
  `;

  const q = a.quality_recognition || {};
  document.getElementById('qualityTitle').textContent = t(q.title_en || 'Accreditations & Recognition', q.title_ta || 'அங்கீகாரங்கள் மற்றும் பாராட்டுகள்');
  document.getElementById('qualityDesc').textContent = t(q.desc_en || '', q.desc_ta || '');
}

async function loadAbout() {
  try {
    const data = await loadHospitalData();
    renderAbout(data);
    document.addEventListener('langchange', () => renderAbout(data));
  } catch (e) { console.error(e); }
}
document.addEventListener('DOMContentLoaded', loadAbout);
</script>
</body>
</html>
