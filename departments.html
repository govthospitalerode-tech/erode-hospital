<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Departments — Thanthai Periyar Govt Hospital Erode</title>
  <link rel="icon" type="image/x-icon" href="/public/favicon.ico"/>
  <link rel="apple-touch-icon" href="/public/favicon-192.png"/>
  <link rel="shortcut icon" href="/public/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css"/>

  <style>
    .dept-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 48px;
    }

    .dept-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      align-items: start;
    }

    /* Flip cards */
    .flip-wrap {
      --card-open-height: 280px;
      height: 280px;
      perspective: 1200px;
      cursor: pointer;
      transition: height 0.3s ease;
    }

    .flip-wrap.flipped {
      height: var(--card-open-height);
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-wrap:focus-visible {
      outline: 3px solid var(--secondary-dk, #82473d);
      outline-offset: 3px;
      border-radius: var(--radius-md, 12px);
    }

    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: var(--radius-md, 12px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Front of card */
    .flip-front {
      display: flex;
      flex-direction: column;
      padding: 28px;
      background: var(--white, #fff);
    }

    .flip-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(
        90deg,
        var(--primary, var(--primary-dk)),
        var(--secondary, #b84a3a)
      );
    }

    .dept-icon {
      margin-bottom: 14px;
      font-size: 36px;
    }

    .dept-name {
      margin: 0 0 6px;
      font-family: 'Manrope', 'Noto Sans Tamil', sans-serif;
      font-size: 18px;
      color: var(--primary, var(--primary-dk));
    }

    .dept-desc {
      flex: 1;
      margin: 10px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted, #6b7280);
    }

    .dept-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .dept-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 4px;
      background: var(--cream, #f8f5f0);
      font-size: 11px;
      font-weight: 600;
      color: var(--primary, var(--primary-dk));
    }

    .flip-hint {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--secondary, #b84a3a);
    }

    /* Back of card */
    .flip-back {
      display: flex;
      flex-direction: column;
      padding: 20px;
      transform: rotateY(180deg);
      background: linear-gradient(
        135deg,
        var(--primary, var(--primary-dk)) 0%,
        var(--primary-lt, #759487) 100%
      );
      border-color: transparent;
    }

    .flip-back-dept-name {
      flex: 0 0 auto;
      margin: 0 0 8px;
      font-family: 'Manrope', 'Noto Sans Tamil', sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
    }

    .flip-back-title {
      flex: 0 0 auto;
      margin-bottom: 12px;
      font-family: 'Manrope', 'Noto Sans Tamil', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--secondary, #b84a3a);
    }

    .flip-doctors {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .flip-doctor-item {
      padding: 8px 10px;
      border-left: 3px solid var(--secondary, #b84a3a);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, 0.95);
    }

    @media (max-width: 900px) {
      .dept-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dept-body {
        padding: 40px 20px;
      }
    }

    @media (max-width: 560px) {
      .dept-grid {
        grid-template-columns: 1fr;
      }

      .flip-wrap {
        height: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-inner,
      .flip-wrap {
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="page-hero">
    <div class="page-hero-inner">
      <div class="page-hero-breadcrumb">
        <a href="/index.html" id="breadHome">Home</a>
        ›
        <span id="breadCurrent">Departments</span>
      </div>
      <h1 id="pageTitle">Our Departments</h1>
      <p id="pageDesc">
        Specialised departments providing free diagnosis, treatment, and surgery
        to all patients. Hover a card to see the medical team.
      </p>
    </div>
  </div>

  <main class="dept-body">
    <div class="dept-grid" id="deptGrid">
      <div class="loading-box">
        <div class="spinner"></div>
        Loading departments...
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/shared.js"></script>
  <script>
    let CURRENT_DEPTS = [];
    let CURRENT_LABELS = {};
    let CURRENT_IS_TA = false;

    function tt(en, ta) {
      return CURRENT_IS_TA ? (ta || en || '') : (en || ta || '');
    }

    function buildGrid() {
      const labels = CURRENT_LABELS;
      const grid = document.getElementById('deptGrid');

      grid.innerHTML = CURRENT_DEPTS.map((department, index) => {
        const doctors = Array.isArray(department.doctors)
          ? department.doctors
          : [];

        // Use this exact translated value for both sides of the card.
        const name = String(
          tt(department.name_en, department.name_ta)
        ).trim();

        const description = String(
          tt(department.desc_en, department.desc_ta)
        );

        const opd = tt(
          department.opd_days_en,
          department.opd_days_ta
        );

        // Leave room for the heading and every doctor on the back.
        const expandedHeight = Math.max(
          280,
          130 + doctors.length * 44
        );

        return `
          <article
            class="flip-wrap fade-up"
            style="animation-delay:${index * 0.04}s; --card-open-height:${expandedHeight}px"
            data-id="${department.id}"
            tabindex="0"
            role="button"
            aria-pressed="false"
            aria-label="${name}"
          >
            <div class="flip-inner">
              <div class="flip-front">
                <div class="dept-icon">${department.icon || ''}</div>
                <h2 class="dept-name">${name}</h2>
                <p class="dept-desc">
                  ${description.length > 100
                    ? `${description.substring(0, 100)}…`
                    : description}
                </p>

                <div class="dept-meta">
                  ${department.beds > 0
                    ? `<span class="dept-badge">🛏️ ${department.beds} ${tt(labels.beds_en, labels.beds_ta)}</span>`
                    : ''}
                  <span class="dept-badge">🕐 ${opd}</span>
                </div>

                <div class="flip-hint">
                  ↩ ${tt(labels.hover_hint_en, labels.hover_hint_ta)}
                </div>
              </div>

              <div class="flip-back">
                <h3 class="flip-back-dept-name">${name}</h3>

                <div class="flip-back-title">
                  👨‍⚕️ ${tt(labels.medical_team_en, labels.medical_team_ta)}
                  (${doctors.length})
                </div>

                <div class="flip-doctors">
                  ${doctors.length
                    ? doctors.map(doctor =>
                        `<div class="flip-doctor-item">${doctor}</div>`
                      ).join('')
                    : `<div class="flip-doctor-item">
                        ${tt(labels.rotating_team_en, labels.rotating_team_ta)}
                      </div>`}
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.flip-wrap').forEach(card => {
        let hoverTimer = null;

        function setFlipped(flipped) {
          card.classList.toggle('flipped', flipped);
          card.setAttribute('aria-pressed', String(flipped));
        }

        // Desktop: wait briefly over the card before flipping.
        card.addEventListener('mouseenter', () => {
          if (!window.matchMedia('(hover: hover)').matches) return;

          window.clearTimeout(hoverTimer);
          hoverTimer = window.setTimeout(() => {
            setFlipped(true);
          }, 500);
        });

        // Pointer leaving the card flips it back.
        card.addEventListener('mouseleave', () => {
          window.clearTimeout(hoverTimer);

          if (window.matchMedia('(hover: hover)').matches) {
            setFlipped(false);
          }
        });

        // Touchscreen: tap to flip and tap again to return.
        card.addEventListener('click', () => {
          if (window.matchMedia('(hover: none)').matches) {
            setFlipped(!card.classList.contains('flipped'));
          }
        });

        // Keyboard: Enter or Space toggles the card.
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            setFlipped(!card.classList.contains('flipped'));
          }
        });
      });
    }

    function renderDepartments(data) {
      const language = localStorage.getItem('gh_lang') || 'en';
      CURRENT_IS_TA = language === 'ta';

      const pageData = data.departments_page;
      if (!pageData) return;

      document.getElementById('breadHome').textContent =
        tt('Home', 'முகப்பு');

      document.getElementById('breadCurrent').textContent =
        tt(
          pageData.page_hero.breadcrumb_en,
          pageData.page_hero.breadcrumb_ta
        );

      document.getElementById('pageTitle').textContent =
        tt(pageData.page_hero.title_en, pageData.page_hero.title_ta);

      document.getElementById('pageDesc').textContent =
        tt(pageData.page_hero.desc_en, pageData.page_hero.desc_ta);

      CURRENT_LABELS = pageData.ui_labels || {};
      CURRENT_DEPTS = pageData.departments_full || [];

      buildGrid();
    }

    async function loadDepartments() {
      try {
        const data = await loadHospitalData();
        renderDepartments(data);

        document.addEventListener('langchange', () => {
          renderDepartments(data);
        });
      } catch (error) {
        console.error('Unable to load hospital departments:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDepartments);
  </script>
</body>
</html>
